name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Set via: gh variable set VITE_API_URL --body "https://<your-render-app>.onrender.com"
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Not a secret -- ships in the public JS bundle regardless. A GH Actions
          # "variable" (not "secret") is the honest choice here; see api.ts's comment.
          # Set via: gh variable set VITE_API_KEY --body "<value also set as API_KEY on Render>"
          VITE_API_KEY: ${{ vars.VITE_API_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
